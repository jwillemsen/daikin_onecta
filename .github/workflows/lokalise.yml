name: Lokalise Translation Sync

on:
  push:
    branches:
      - master
    paths:
      - 'custom_components/daikin_onecta/translations/en.json'
  repository_dispatch:
    types: [lokalise_webhook]
  schedule:
    - cron: '0 2 * * *' # Elke nacht om 02:00 UTC als vangnet
  workflow_dispatch: # Handmatige startknop in GitHub Actions UI

jobs:
  # TAAK 1: Engelse bronbestanden direct uploaden
  push-source:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installeer Lokalise CLI v2 via curl
        run: |
          curl -sfL https://raw.githubusercontent.com/lokalise/lokalise-cli-2-go/master/install.sh | sh
          sudo mv ./bin/lokalise2 /usr/local/bin/lokalise2

      - name: Push en.json naar Lokalise
        run: |
          lokalise2 file upload \
            --token "${{ secrets.LOKALISE_API_TOKEN }}" \
            --project-id "${{ secrets.LOKALISE_PROJECT_ID }}" \
            --file "custom_components/daikin_onecta/translations/en.json" \
            --lang-iso "en" \
            --convert-placeholders=1

  pull-translations:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Officiële installer die we ook bij de bulk-upload gebruikten
      - name: Installeer Lokalise CLI v2
        uses: lokalise/install-lokalise-cli-v2@v2.1.0
        with:
          add-to-path: true

      # Download de bestanden exact in het juiste Home Assistant formaat
      - name: Download vertalingen uit Lokalise
        run: |
          lokalise2 file download \
            --token "${{ secrets.LOKALISE_API_TOKEN }}" \
            --project-id "${{ secrets.LOKALISE_PROJECT_ID }}" \
            --format "json" \
            --directory-prefix "custom_components/daikin_onecta/translations/" \
            --bundle-structure "%LANG_ISO%.%FORMAT%" \
            --original-filenames=false \
            --all-languages=true \
            --replace-modified=1 \
            --include-empty-translations=false
      - name: Run Hassfest Validation
        uses: home-assistant/actions/hassfest@master

      - name: Create Pull Request met nieuwe vertalingen
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update translation files van Lokalise"
          title: "🤖 Translation updates van Lokalise"
          body: "Deze automatische PR bevat de nieuwste vertalingen vanuit het Lokalise project."
          branch: "lokalise-translations"
          delete-branch: true
