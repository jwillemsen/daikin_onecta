name: Lokalise Translation Sync

on:
  push:
    branches:
      - master
    paths:
      - 'custom_components/daikin_onecta/translations/en.json'
  repository_dispatch:
    types: [lokalise_webhook]
  schedule:
    - cron: '0 2 * * *' # Elke nacht om 02:00 UTC als vangnet
  workflow_dispatch: # Handmatige startknop in GitHub Actions UI

jobs:
  # TAAK 1: Engelse bronbestanden direct uploaden
  push-source:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Installeer Lokalise CLI v2 via curl
        run: |
          curl -sfL https://raw.githubusercontent.com/lokalise/lokalise-cli-2-go/master/install.sh | sh
          sudo mv ./bin/lokalise2 /usr/local/bin/lokalise2

      - name: Push en.json naar Lokalise
        run: |
          lokalise2 file upload \
            --token "${{ secrets.LOKALISE_API_TOKEN }}" \
            --project-id "${{ secrets.LOKALISE_PROJECT_ID }}" \
            --file "custom_components/daikin_onecta/translations/en.json" \
            --lang-iso "en" \
            --convert-placeholders=1

  pull-translations:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull vertalingen uit Lokalise
        uses: lokalise/lokalise-pull-action@v5.3.0
        with:
          api_token: ${{ secrets.LOKALISE_API_TOKEN }}
          project_id: ${{ secrets.LOKALISE_PROJECT_ID }}
          translations_path: 'custom_components/daikin_onecta/translations'
          file_format: 'json'
          flat_naming: true
          override_base_branch: 'master'
          always_pull_base: true
          additional_params: '--bundle-structure=%LANG_ISO%.%FORMAT%'

      - name: Run Hassfest Validation
        uses: home-assistant/actions/hassfest@master
