name: Lokalise Bulk Upload Existing Translations

on:
  workflow_dispatch: # Handmatig te starten via de GitHub Actions tab

jobs:
  bulk-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Officiële installer met het juiste, volledige versienummer
      - name: Installeer Lokalise CLI v2
        uses: lokalise/install-lokalise-cli-v2@v2.1.0
        with:
          add-to-path: true

      - name: Push alle bestaande .json bestanden naar Lokalise
        run: |
          cd custom_components/daikin_onecta/translations/

          for file in *.json; do
            # Haal de taalcode uit de bestandsnaam (bijv. nl uit nl.json)
            lang="${file%.json}"

            echo "Uploading $file als taalcode: $lang ..."

            lokalise2 file upload \
              --token "${{ secrets.LOKALISE_API_TOKEN }}" \
              --project-id "${{ secrets.LOKALISE_PROJECT_ID }}" \
              --file "$file" \
              --lang-iso "$lang" \
              --convert-placeholders=1 \
              --replace-modified=1
          done
